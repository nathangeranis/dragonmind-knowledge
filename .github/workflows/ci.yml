name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      KNOWLEDGE_TEST_CONNECTION: Host=localhost;Port=5455;Database=knowledge;Username=knowledge
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Dragonmind.Knowledge.sln

      - name: Build (warnings are errors)
        run: dotnet build Dragonmind.Knowledge.sln -c Release --no-restore -warnaserror

      - name: Unit tests
        run: dotnet test tests/Dragonmind.Knowledge.UnitTests -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Start Postgres with pgvector and Apache AGE
        run: docker compose up -d --build --wait db

      - name: Integration tests
        run: dotnet test tests/Dragonmind.Knowledge.IntegrationTests -c Release --no-build

      - name: Stop Postgres
        if: always()
        run: docker compose down -v

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
